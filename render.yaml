services:
  - type: web
    name: foundryrooms-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Readiness (probes the database), not just liveness — a DB-less
    # instance must leave rotation. /api/v1/auth/health remains an alias.
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
