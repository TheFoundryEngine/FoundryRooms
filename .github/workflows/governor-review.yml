name: Governor Agent Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  governor-review:
    name: governor-review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/main...HEAD > pr.diff
          echo "diff_size=$(wc -c < pr.diff)" >> $GITHUB_OUTPUT

      - name: Get changed files
        id: files
        run: |
          git diff --name-only origin/main...HEAD > changed_files.txt
          cat changed_files.txt

      - name: Run Governor Agent review
        id: governor
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/governor-review.sh

      - name: Post Governor review as PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          REVIEW_TEXT: ${{ steps.governor.outputs.review }}
        with:
          script: |
            const reviewText = process.env.REVIEW_TEXT || 'Governor Agent review failed -- check workflow logs.';
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Post as a formal PR review (not just a comment)
            const isRejected = reviewText.includes('REJECTED');
            const isChangesRequested = reviewText.includes('CHANGES REQUESTED');
            const isApproved = reviewText.includes('APPROVED');

            let event = 'COMMENT';
            if (isApproved) event = 'APPROVE';
            else if (isRejected || isChangesRequested) event = 'REQUEST_CHANGES';

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: prNumber,
              body: `## Governor Agent Review\n\n${reviewText}`,
              event: event
            });

            // Add a label to make the status immediately visible
            const label = isApproved ? 'governor-approved' : 'governor-rejected';
            // Remove the opposite label if it exists
            const oppositeLabel = isApproved ? 'governor-rejected' : 'governor-approved';
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: oppositeLabel });
            } catch (e) { /* label may not exist, ignore */ }
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [label] });
            } catch (e) { /* label may not exist yet, ignore */ }
