name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [CI, Governor Agent Review]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Check all required status checks
        uses: actions/github-script@v7
        id: checks
        with:
          script: |
            const pr = context.payload.pull_request ||
              (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.number || context.payload.workflow_run?.pull_requests?.[0]?.number
              })).data;

            if (!pr) {
              console.log('No PR found, skipping.');
              return false;
            }

            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
            });

            const required = ['lint', 'unit-tests', 'integration-tests', 'contract-tests', 'architecture-tests', 'build', 'governor-review'];
            const results = checks.check_runs.reduce((acc, run) => {
              acc[run.name] = { status: run.status, conclusion: run.conclusion };
              return acc;
            }, {});

            console.log('Check results:', JSON.stringify(results, null, 2));

            const allPassed = required.every(name => {
              const check = results[name];
              return check && check.status === 'completed' && check.conclusion === 'success';
            });

            console.log('All required checks passed:', allPassed);
            return allPassed;

      - name: Check PR has at least one approval
        uses: actions/github-script@v7
        id: approval
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return false;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const approved = reviews.some(r => r.state === 'APPROVED');
            console.log('PR has approval:', approved);
            return approved;

      - name: Enable auto-merge
        if: steps.checks.outputs.result == 'true' && steps.approval.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: pr.title,
              commit_message: `Auto-merged PR #${pr.number} after all checks passed and approval received.\n\n${pr.body || ''}`
            });

            console.log(`PR #${pr.number} auto-merged successfully.`);

      - name: Post merge-blocked comment
        if: steps.checks.outputs.result != 'true' || steps.approval.outputs.result != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No PR context, skipping comment.');
              return;
            }

            const checksPassed = `${{ steps.checks.outputs.result }}` === 'true';
            const hasApproval = `${{ steps.approval.outputs.result }}` === 'true';

            let reasons = [];
            if (!checksPassed) reasons.push('one or more required CI checks have not passed yet (lint, unit-tests, integration-tests, contract-tests, architecture-tests, build, or governor-review)');
            if (!hasApproval) reasons.push('waiting for human approval — a team member must review and approve this PR');

            let actions = [];
            if (!checksPassed) actions.push('Check the [Actions tab](${pr.html_url}/checks) for any failed checks');
            if (!checksPassed) actions.push('Read the Governor Agent review comment for any architectural issues');
            if (!checksPassed) actions.push('Fix any issues and push to this branch — checks will re-run automatically');
            if (!hasApproval) actions.push('Request a review from a team member');
            actions.push('Once all checks pass and a human approves, the PR will auto-merge');

            const body = `## ⏳ Auto-merge pending\n\nThis PR is waiting on:\n\n${reasons.map(r => `- ${r}`).join('\n')}\n\n**Next steps:**\n${actions.map(a => `- ${a}`).join('\n')}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: body
            });
